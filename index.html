<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Internship Tracker</h1>
        <p>Keep track of all your applications</p>
    </header>

    <!-- Stats bar -->
    <section class="stats">
        <div class="stat-card">Total Applied: 0</div>
        <div class="stat-card">Interviews: 0</div>
        <div class="stat-card">Offers: 0</div>
    </section>

    <!-- Main content -->
    <div class="main">

    <!-- Add application form -->
    <section class="form-section">
        <h2>Add Application</h2>
        <form>
            <input type="text" placeholder="Company name" />
            <input type="text" placeholder="Role" />
            <select>
                <option>Applied</option>
                <option>Phone Screen</option>
                <option>Interview</option>
                <option>Offer</option>
                <option>Rejected</option>
            </select>
            <input type="date" id="dateInput" />
            <input type="text" placeholder="Notes (optional)" id="notesInput" />
            <button type="submit">Add</button>
        </form>
    </section>

    <!-- Filter buttons -->
    <div class="filters">
        <button class="filter-btn active" data-filter="All">All</button>
        <button class="filter-btn" data-filter="Applied">Applied</button>
        <button class="filter-btn" data-filter="Phone Screen">Phone Screen</button>
        <button class="filter-btn" data-filter="Interview">Interview</button>
        <button class="filter-btn" data-filter="Offer">Offer</button>
        <button class="filter-btn" data-filter="Rejected">Rejected</button>
    </div>

    <!-- Applications list -->
    <section class="applications-section">
        <h2>My Applications</h2>
        <p class="empty-state">No applications yet. Add one above!</p>
    </section>

</div>
<script src="script.js"></script>
</body>
</html>
